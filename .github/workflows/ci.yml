name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: nothing in this workflow writes to the repo (P3-03).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: bash Scripts/check-plugins.sh

  build:
    # Pinned image, not macos-latest: this project targets Xcode 16.x
    # (CreatedOnToolsVersion 16.0) and macos-latest now maps to a newer major.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select newest Xcode 16.x
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_16*.app)
          if (( ${#candidates[@]} == 0 )); then
            echo "No Xcode 16 installation is available" >&2
            exit 1
          fi
          xcode=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Build (Debug)
        run: >
          xcodebuild build -project NoteClarity.xcodeproj -scheme NoteClarity
          -configuration Debug -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Unit tests
        run: bash Scripts/test.sh

      - name: Build (Release)
        run: >
          xcodebuild build -project NoteClarity.xcodeproj -scheme NoteClarity
          -configuration Release -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Archive dry-run (unsigned)
        run: >
          xcodebuild archive -project NoteClarity.xcodeproj -scheme NoteClarity
          -configuration Release -archivePath build/dryrun.xcarchive
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

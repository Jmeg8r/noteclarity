# WHAT: PR gate for noteclarity — local AI review of the change and its blast radius via
#       the sovereign-forge review-broker, posted as a verdict comment by
#       'forgejo-actions' plus this job's commit status.
# WHY:  noteclarity had no review gate, so `forge-pr merge` (which fails closed on a
#       missing verdict) could never merge here without a manual override. Installed by
#       change docs/changes/2026-11-09-adopt-gate-kit/ (gate kit only, not the full Loop
#       kit), which also moved the Linux-safe CI checks into .forgejo/workflows/ci.yml.
# ADVISORY BY DESIGN: review-pr.sh posts findings and exits 0 on any real verdict.
#       What makes it a MERGE gate is forge-pr: its decide() refuses to merge without a
#       verdict comment by GATE_USER at the current head.
# TEMPLATE: copied from divtrack's .forgejo/workflows/ai-review.yml at its forge
#       origin/main 9ff77bd (itself adapted from claude-config's); only this header and
#       the standards comment differ. Keep it that way so fixes carry over, and re-sync
#       from the forge copy, not a local checkout (a stale one still has 30-minute limits).
# GATE KIT: bin/review-pr.sh and bin/blast-radius.py are byte-identical copies of
#       sovereign-forge's bin/ (copied from its origin/main @ 6e766d0). Never edit
#       them here; fix upstream and re-copy. sovereign-forge's bin/check-gate-kit.sh
#       verifies the `cmp` daily, and that this job stays in the arm64 review lane.
#
# THREAT MODEL (L40): single-owner repo. Forge jfcadm/noteclarity is private with 0
#       collaborators and 0 forks; the GitHub mirror is PUBLIC, with 0 forks and only
#       its owner as collaborator (verified 2026-11-09). The adversary is OWNER ACCIDENTS
#       and compromised third-party code (actions, packages), not a malicious contributor.
#       Hence base-pinned gate scripts and a SHA-pinned checkout (a mistaken or tampered
#       PR cannot grade itself or post a forged PASS), bounded runtime. NOT least
#       privilege: Forgejo ignores job-level `permissions:`, so the automatic token
#       carries the forge's pull_request_target default (repo write), which is why the
#       only third-party action is SHA-pinned. Because the mirror is public, this file
#       publishes the forge and broker tailnet addresses below; they are unreachable off
#       the tailnet, and no secret value appears here (secrets come from the forge).
#
# Lives in .forgejo/workflows (not .github): Forgejo ignores .github/workflows once
# .forgejo/workflows exists, and keeping it out of .github means the GitHub mirror
# never tries to run it. The one file left in .github/workflows is ci.yml, kept for the
# mirror's macOS build backstop; .forgejo/workflows/ci.yml's workflow-placement job
# fails if any other workflow lands there.
name: ai-review
# pull_request_target, not pull_request: with pull_request the workflow YAML
# ITSELF executes from the PR tree, so a PR could rewrite these steps to post a
# forged PASS as forgejo-actions or exfiltrate BROKER_TOKEN. Under
# pull_request_target the YAML and every run: block come from the BASE ref; the
# PR enters only as the checked-out data below. Consequence: the PR that
# INTRODUCES this file gets no run (nothing on base to execute) — that single
# bootstrap PR merges manually; every later PR is gated.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Kill switch: runs only while the repo variable AI_REVIEW_ENABLED is exactly
    # "true" (same convention as claude-memory). Unset means OFF, which leaves
    # forge-pr blocking on "no verdict at head" — flip it deliberately:
    #   forge repo variable AI_REVIEW_ENABLED = true | false
    # base_ref guard: only the push-protected main may source trusted gate code.
    if: github.base_ref == 'main' && vars.AI_REVIEW_ENABLED == 'true'
    # arm64 is the forge's REVIEW LANE (sovereign-forge change
    # docs/changes/2026-09-27-runner-review-lane): one runner at capacity 1, so AI
    # reviews never overlap. A review on ubuntu-latest would run in the CI lane beside
    # another review and spend its 3600s budget waiting on the broker's REVIEW_LOCK
    # (-> verdict "error", a red job).
    runs-on: arm64
    # Declares the INTENDED scope (read to check out, write to PRs/issues only to post
    # the verdict). It is NOT enforced here: Forgejo 15 ignores job-level `permissions`
    # (forgejo.org/docs/v15.0/user/actions/github-actions), so on the forge the token
    # has its default authority. Kept so the intent is written down and enforced if a
    # future Forgejo honours it.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # A forge or broker outage must not pin the runner with the gate stuck pending.
    timeout-minutes: 70
    steps:
      - name: Check out the PR head as data, with full history
        # Pinned to a reviewed commit SHA (actions/checkout v4), not the mutable
        # tag — same SHA claude-memory pins, for the same reason: this job
        # exposes both tokens.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # pull_request_target checks out the BASE by default; the review
          # subject is the PR head. It is DATA — executables are re-pinned below.
          ref: ${{ github.event.pull_request.head.sha }}
          # The gate diffs against the base branch; a shallow clone would leave
          # nothing to compare and it would (correctly) refuse to review.
          fetch-depth: 0

      # The arm64 image is node:22-bookworm, which lacks jq (checked 2026-09-27; the
      # ubuntu-latest image had it). Same install step as sovereign-forge's ai-review.yml.
      - name: Install the gate's dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq jq python3 curl git >/dev/null

      - name: Fail fast on missing gate dependencies
        run: |
          for bin in jq python3 curl git awk; do
            command -v "$bin" >/dev/null \
              || { echo "::error::$bin not on the runner image — the gate cannot run"; exit 1; }
          done
          echo "jq $(jq --version), $(python3 --version)"

      # THE GATE RUNS BASE-TRUSTED CODE OVER THE PR TREE. A PR editing
      # bin/review-pr.sh must not run its own edit with the forge token in scope.
      # Trusted copies go to RUNNER_TEMP (not PR-shapeable), and a missing base
      # copy FAILS CLOSED — the scripts land in the same commit as this workflow,
      # so once the workflow runs from base the scripts are there by construction.
      - name: Materialize the gate scripts from the protected base
        run: |
          git fetch origin main --quiet
          mkdir -p "$RUNNER_TEMP/gate"
          for f in review-pr.sh blast-radius.py; do
            git show "origin/main:bin/$f" > "$RUNNER_TEMP/gate/$f" \
              || { echo "::error::bin/$f absent on protected base — refusing to run an unpinned gate"; exit 1; }
            chmod +x "$RUNNER_TEMP/gate/$f"
          done
          echo "gate scripts pinned to origin/main under $RUNNER_TEMP/gate"

      - name: Run the review
        env:
          GATE_BIN: ${{ runner.temp }}/gate
          # Forgejo's per-run, repo-scoped token; its comments post as
          # 'forgejo-actions', which is exactly forge-pr's default GATE_USER.
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BROKER_TOKEN: ${{ secrets.BROKER_TOKEN }}
          FORGE_API: http://100.88.14.2:3300/api/v1
          BROKER_URL: http://100.88.14.2:3401
          REVIEW_REPO: ${{ github.repository }}
          # Standards come from noteclarity's CLAUDE.md "## 3. Standards" section (the
          # extractor's default ^## 3\. .. ^## 4\. markers), read from the BASE ref.
          # review-pr.sh fails closed on zero, so a heading rename surfaces loudly.
        run: |
          # Force-update the local base ref and FAIL CLOSED if the fetch fails, so
          # a stale main on a reused runner cannot supply obsolete standards.
          git fetch origin "+${{ github.base_ref }}:${{ github.base_ref }}"
          bash "$RUNNER_TEMP/gate/review-pr.sh" \
            --pr "${{ github.event.number }}" \
            --base "${{ github.base_ref }}"
